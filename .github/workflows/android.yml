name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create App Structure
        run: |
          npm install -g cordova
          # Creato con l'id e il nome corretti
          cordova create myApp com.lyricsyncher2.app "LyricSyncher 2"
          cd myApp
          cp ../index.html www/index.html
          cordova platform add android

      - name: Override Icons and Build
        run: |
          cd myApp
          # Sovrascrive le icone con la tua icon.png prima del build
          find platforms/android -name "ic_launcher*.png" -exec cp ../icon.png {} \;
          
          # Compila
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LyricSyncher2-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
