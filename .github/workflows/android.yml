name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create App Structure
        run: |
          # Installa cordova
          npm install -g cordova
          
          # Crea il progetto
          cordova create myApp com.lyricsyncher2.app LyricSyncher 2
          cd myApp
          
          # Copia il tuo index.html
          cp ../index.html www/index.html
          
          # Aggiunge la piattaforma android
          cordova platform add android
          
          # Sovrascrive le icone predefinite di Android con la TUA icon.png
          # Copia in varie densità per sicurezza
          cp ../icon.png platforms/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp ../icon.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp ../icon.png platforms/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp ../icon.png platforms/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp ../icon.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LyricSyncher-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
