name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create App Structure
        run: |
          npm install -g cordova
          cordova create app com.lyricsyncher.app LyricSyncher
          
          # Sostituisce i file di default con i tuoi
          rm -rf app/www/*
          cp index.html app/www/index.html
          
          # Gestione base dell'icona
          mkdir -p app/www/img
          cp icon.png app/www/img/logo.png || true

      - name: Build APK
        run: |
          cd app
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LyricSyncher-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
