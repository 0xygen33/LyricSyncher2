name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build App
        run: |
          npm install -g cordova
          cordova create myApp com.lyricsyncher2.app "LyricSyncher 2"
          cd myApp
          
          cp ../index.html www/index.html
          cp ../icon.png icon.png
          
          # Inietta la configurazione sia per l'icona dell'app che per lo splash screen
          sed -i 's|</widget>|    <icon src="icon.png" />\n    <splash src="icon.png" />\n    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="icon.png" />\n</widget>|' config.xml
          
          cordova platform add android
          cordova build android --debug -- --cdvBuildMultipleApks=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LyricSyncher2-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          
